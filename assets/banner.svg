<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="kload: pick a Kubernetes cluster with your arrow keys">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D14"/>
      <stop offset="1" stop-color="#151a30"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="1" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#glowA)"/>
    <rect width="1280" height="340" fill="url(#glowB)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
  </g>

  <!-- Logo -->
  <g transform="translate(88 92)">
    <rect width="120" height="120" rx="28" fill="url(#brand)"/>
    <rect x="44" y="30" width="50" height="12" rx="6" fill="#fff" opacity=".4"/>
    <rect x="44" y="54" width="50" height="12" rx="6" fill="#fff"/>
    <rect x="44" y="78" width="50" height="12" rx="6" fill="#fff" opacity=".4"/>
    <path d="M24 51l9 9-9 9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="240" y="160" font-size="86" font-weight="800" fill="#fff" letter-spacing="-2">kload</text>
    <text x="243" y="204" font-size="24" fill="#A9B1D6">Pick a Kubernetes cluster with your arrow keys.</text>
  </g>

  <!-- Install pill -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect x="240" y="232" width="430" height="44" rx="22" fill="#1A1F33" stroke="#2E3554"/>
    <text x="262" y="260" fill="#E5E7EB"><tspan fill="#A78BFA">$</tspan> brew install hasan-munsi/tap/kload</text>
  </g>

  <!-- Menu preview -->
  <g transform="translate(870 70)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect width="330" height="200" rx="14" fill="#0F1117" stroke="#2A2F45"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F57"/>
    <circle cx="36" cy="18" r="5" fill="#FEBC2E"/>
    <circle cx="52" cy="18" r="5" fill="#28C840"/>
    <g fill="#6B7280"><text x="38" y="56">FILE</text><text x="168" y="56">CLUSTER</text></g>
    <g fill="#C9D1E3"><text x="38" y="84">config</text><text x="168" y="84">docker-desktop</text></g>
    <g fill="#C9D1E3"><text x="38" y="110">dev.yaml</text><text x="168" y="110">kind-dev</text></g>
    <rect x="12" y="119" width="306" height="24" rx="6" fill="#7C5CFF" fill-opacity=".3" stroke="#7C5CFF" stroke-opacity=".7"/>
    <text x="22" y="136" fill="#A78BFA">&gt;</text>
    <g fill="#fff"><text x="38" y="136">staging.yaml</text><text x="168" y="136">eks-staging</text></g>
    <g fill="#C9D1E3"><text x="38" y="162">prod.yaml</text><text x="168" y="162">gke-prod</text></g>
    <text x="20" y="186" fill="#4B5563" font-size="12">↑/↓ move · Enter load · Esc cancel</text>
  </g>
</svg>
